name: Incorporate main into seamless

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: main-to-seamless
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.main.outputs.ready }}
      sha: ${{ steps.main.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: main
        run: node scripts/verified-main.mjs
        env:
          GH_TOKEN: ${{ github.token }}
  integrate:
    needs: verify
    if: needs.verify.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/seamless-world-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare a real main merge
        id: merge
        shell: bash
        env:
          VERIFIED_MAIN: ${{ needs.verify.outputs.sha }}
        run: |
          git fetch origin main codex/seamless-world-foundation
          if git merge-base --is-ancestor "$VERIFIED_MAIN" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git merge --no-ff --no-commit "$VERIFIED_MAIN"; then
            echo "::error::Main needs a conflict resolution on seamless. No branch was published. Resolve the merge; do not discard either side or replace it with cherry-picks."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.merge.outputs.changed == 'true'
        run: npm ci
      - if: steps.merge.outputs.changed == 'true'
        name: Prepare the Linux desktop sandbox
        shell: bash
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          xvfb-run --auto-servernum node_modules/.bin/electron --version
      - if: steps.merge.outputs.changed == 'true'
        name: Type-check the integrated game
        run: npm run check
      - if: steps.merge.outputs.changed == 'true'
        name: Launcher checks
        run: npm run test:launcher
      - if: steps.merge.outputs.changed == 'true'
        name: Current gameplay and hosted entry
        run: npm run probe -- --jobs 2
      - if: steps.merge.outputs.changed == 'true'
        name: Shared combat simulation
        run: npm run sim -- run --suite smoke
      - if: steps.merge.outputs.changed == 'true'
        name: Generation checks
        run: npm run genqa
      - if: steps.merge.outputs.changed == 'true'
        name: Build the integrated client
        run: npm run build
      - if: steps.merge.outputs.changed == 'true'
        name: Actual tutorial, Mu, continuous travel and Continue
        run: xvfb-run --auto-servernum npm run smoke:world
      - if: steps.merge.outputs.changed == 'true'
        name: Publish only the verified merge
        shell: bash
        env:
          VERIFIED_MAIN: ${{ needs.verify.outputs.sha }}
        run: |
          mkdir -p .claude
          printf '[files]\n' > .claude/ownership.main-sync.txt
          node scripts/ownership-gate.mjs --allow .claude/ownership.main-sync.txt
          git commit -m "Merge main into seamless"
          git merge-base --is-ancestor "$VERIFIED_MAIN" HEAD
          git push origin HEAD:refs/heads/codex/seamless-world-foundation
      - uses: actions/upload-artifact@v4
        if: always() && steps.merge.outputs.changed == 'true'
        with:
          name: main-integration-playthrough
          if-no-files-found: ignore
          path: |
            balance/reports/seamless-playthrough/REPORT.json
            balance/reports/seamless-playthrough/*.png
