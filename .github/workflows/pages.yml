name: Deploy coordinated browser and desktop games

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main, codex/seamless-world-foundation]

permissions:
  contents: read
  actions: read

# One complete catalog/deployment at a time; neither platform publishes alone.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.main.outputs.ready }}
      sha: ${{ steps.main.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: main
        run: node scripts/verified-main.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: verify
    if: needs.verify.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pin successful source CI for every released branch
        run: node scripts/plan-coordinated-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build the site database and portraits
        run: |
          npx tsx scripts/export-web-data.ts
          npx vite build --config vite.portraits.config.ts
      - name: Build each game once and stage both clients together
        run: node scripts/build-coordinated-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify real browser and desktop entry, identity and storage
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          xvfb-run --auto-servernum node_modules/.bin/electron scripts/smoke-coordinated-release.cjs
      - name: Fetch the site's films
        run: node scripts/fetch-site-media.mjs
      - name: Upload the complete catalog and both client artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
