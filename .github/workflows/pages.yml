name: Deploy site to GitHub Pages

# Regenerates the site's data from src/data after successful CI, then deploys.
# This is what keeps the Database (and later the Passive Tree) at parity with
# the game: the JSON is never committed by hand — it's rebuilt here each time.

on:
  workflow_dispatch: {}
  # Only the configured, same-repository experiment can refresh the preview.
  # This workflow runs from main, so the Pages environment remains main-only.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main, codex/seamless-world-foundation]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.main.outputs.ready }}
      sha: ${{ steps.main.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: main
        run: node scripts/verified-main.mjs
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: verify
    if: needs.verify.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export game data → site/data/*.json
        run: npx tsx scripts/export-web-data.ts

      # The database page's monster portraits: the game's own painters
      # (render/vis/portrait.ts + the part grammar + LOOKS), bundled as one
      # iife the page loads beside the JSON — site pixels regenerate from
      # src/ on every deploy exactly like site facts do.
      - name: Build the portrait bundle → site/assets/portraits.js
        run: npx vite build --config vite.portraits.config.ts

      # --- Phase 3: the playable in-browser demo, built into site/play ---
      # The game is a static Vite build; --base=./ keeps hashed asset URLs
      # relative so they resolve at the /arpg-game-world/play/ sub-path.
      # This exact main commit already passed types, probes and a client boot
      # in CI. Saves fall back to localStorage on this static host.
      - name: Build the in-browser demo → site/play
        run: npx vite build --base=./ --outDir site/play --emptyOutDir

      - name: Validate browser-preview configuration
        run: node --test scripts/test-browser-previews.mjs

      - name: Build isolated branch previews → site/dev
        run: node scripts/build-browser-previews.mjs

      # The site cinema's films live on the `site-media` release, never in
      # git; pull them in beside the pages (verified against
      # site/media/manifest.json) so they serve from the site's own origin.
      - name: Fetch the site's films → site/media
        run: node scripts/fetch-site-media.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
