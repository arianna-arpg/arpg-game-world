# THE FULL-GATE CLOCK: decides when the full gate (ci.yml) runs, re-runs a red
# run's failed jobs once, raises or closes the single rolling alarm issue, and
# starts what a green gate sets off. All the rules live in scripts/full-gate-clock.mjs and are pinned by
# scripts/test-ci-policy.mjs. See docs/ai/test-cadence.md.
#
# The cron slots are deliberately many. GitHub delays and sometimes drops
# scheduled runs by hours (the slots before 07:00 UTC often land after it), so the
# first slot to fire after a gate day begins runs the gate, and every later slot
# wakes up, finds it current and exits in seconds.
#
# A gate wakes the clock from its own last job (ci.yml's announce), because GitHub
# starts no workflow_run for a run that GITHUB_TOKEN dispatched. Dispatched on any
# other ref, the clock only reports, so this path can be proven on a topic branch.
name: full-gate-clock

on:
  schedule:
    - cron: '47 1 * * *'
    - cron: '47 4 * * *'
    - cron: '17 7 * * *'
    - cron: '47 9 * * *'
    - cron: '17 12 * * *'
    - cron: '47 15 * * *'
    - cron: '17 20 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      finished_run:
        description: The gate run that just ended and sent this wake
        required: false
        type: string

permissions:
  contents: read
  actions: write   # dispatch ci.yml and its followers, re-run its failed jobs, read its report
  issues: write    # the alarm

# Wakes run one at a time so two of them cannot both decide to dispatch. A branch's
# report-only wakes queue apart, because a newer wake pushes a waiting one out.
concurrency:
  group: full-gate-clock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/full-gate-clock.mjs
        env:
          GH_TOKEN: ${{ github.token }}
