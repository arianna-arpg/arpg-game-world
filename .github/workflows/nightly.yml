# ---------------------------------------------------------------------------
# NIGHTLY RELEASE CANDIDATES — every night, IF main carries new commits since
# the newest release tag (stable or RC alike), cut the next patch-numbered
# tag (v0.5.0 → v0.5.1 → v0.5.2 → …) and run the normal release pipeline on
# it, published as a PRERELEASE. A quiet night cuts nothing.
#
# WHO GETS A NIGHTLY: every installed launcher on the default 'nightly'
# channel (launcher/updates.cjs; contract in docs/engine/updates.md) — it
# reads the release LIST and takes the newest PUBLISHED build, so an RC cut
# here reaches players that day. Only the opt-in 'stable' channel reads
# /releases/latest, which by API definition never serves a prerelease.
#
# PLAYER SAFETY = THE FAILED-NIGHT LAW: a launcher can only be offered what
# was PUBLISHED, and nothing about a failed night ever is —
#   red verify (below)            → `cut` never runs: no tag, no release
#   red package leg / red         → release.yml's uploads sit in a DRAFT, and
#   packaged smoke / red finalize   only `finalize` (needs every leg) flips it
#                                   public; anonymous API callers — i.e.
#                                   every launcher — never see drafts
# So a red night costs players nothing but a day: they keep the last good
# night, the alarm rings, and the next night either re-runs the unpublished
# tag (no new commits) or cuts the next number (new commits).
#
# Numbering law: nightlies bump the PATCH of the newest existing vX.Y.Z tag;
# hand-cut stables keep bumping the MINOR (v0.6.0), which numerically
# supersedes every v0.5.x RC for the launcher's compare — and the next
# night's RC becomes v0.6.1 automatically.
#
# Why the dispatch hop: tags pushed with the workflow's own GITHUB_TOKEN
# never trigger on:push workflows (Actions' recursion guard), so this job
# pushes the tag inertly and then dispatches release.yml on that tag ref
# explicitly, with rc=true so its finalize publishes as a prerelease.
#
# No bump commit exists for an RC tag — release.yml stamps the tag's version
# into the CI workspace instead (see its "Stamp tag version" step), so
# electron-builder's draft, the artifact names, and the packaged launcher's
# identity all read the tag, and main's history stays free of bot commits
# (which would otherwise re-trigger the "new commits?" gate forever).
#
# THE FULL LANE: `verify` runs the whole green probe roster — the fast lane
# ci.yml runs on every push PLUS the heavy rigs (`--slow`) that are too
# expensive to pay per push — and `cut` needs it. An RC is a build testers
# install, so a red night cuts nothing and says why; the manual dispatch
# button re-tries once the tree is green again.
# ---------------------------------------------------------------------------
name: nightly-rc

on:
  schedule:
    - cron: '37 8 * * *'   # 03:37 America/Chicago — off-:00 minute, GitHub delays the herd slots
  workflow_dispatch:        # manual "cut an RC now" button (same no-new-commits gate applies)

permissions:
  contents: write   # push the RC tag
  actions: write    # dispatch release.yml on it
  issues: write     # the red-night alarm (`alarm` below) + the green cut's close

concurrency: nightly-rc

jobs:
  # The full correctness lane — ci.yml's two commands, with the heavy probe
  # rigs added. Nothing gets tagged for testers over a red tree.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check (game + launcher + balance harness)
        run: npm run check
      # The update path's laws (selection, the failed-night law, the digest
      # law) — a launcher that cannot update can never be sent its own fix.
      - name: Launcher update laws
        run: npm run test:launcher
      - name: Probes (green roster, fast + slow lanes)
        run: npm run probe -- --slow

  cut:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags — the gate is rev-list against the last tag

      - name: Gate on new commits, then tag and dispatch the release
        id: cut
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          last="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
          if [ -z "$last" ]; then
            echo "No vX.Y.Z release tags exist — cut the first release by hand before enabling nightlies."
            exit 1
          fi
          count="$(git rev-list "$last..HEAD" --count)"
          if [ "$count" -eq 0 ]; then
            # HEAD is exactly $last — but did that cut ever SHIP? A red
            # release leg leaves the tag standing over a hidden draft, and
            # with no new commits the old gate skipped it forever: a night
            # players follow was lost to one transient upload error. GET
            # /releases/tags/:tag answers only for a PUBLISHED release
            # (drafts 404, even to this token), so it is the shipped test.
            if gh api "repos/$REPO/releases/tags/$last" --silent >/dev/null 2>&1; then
              echo "HEAD is exactly $last, and $last is published — nothing to cut tonight."
              echo "dispatched=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # An RC tag carries no bump commit, so package.json still names
            # an OLDER version; a hand-cut stable's tag equals it. A stable
            # is a human's to re-run (and must never publish as an RC).
            if [ "v$(jq -r .version package.json)" = "$last" ]; then
              echo "::warning::$last is a hand-cut stable that was never published — re-run its release by hand; skipping tonight."
              echo "dispatched=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$last was tagged but never published (a red release leg) — re-running its release."
            gh workflow run release.yml --ref "$last" -f rc=true
            echo "dispatched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ver="${last#v}"
          IFS=. read -r ma mi pa <<<"$ver"
          next="v$ma.$mi.$((pa + 1))"
          echo "$count commit(s) since $last — cutting $next at $(git rev-parse --short HEAD)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "Nightly RC $next — $count commit(s) since $last"
          git push origin "refs/tags/$next"
          gh workflow run release.yml --ref "$next" -f rc=true
          echo "dispatched=true" >> "$GITHUB_OUTPUT"
          echo "Dispatched release.yml on $next. It publishes (as a prerelease) only if both OS legs build AND smoke their package."

      # The green half of THE RED-NIGHT ALARM (see `alarm` below), for the
      # QUIET night only: verify is green and the newest tag is published, so
      # the lane is healthy and any standing `nightly-red` issue is answered.
      # When a release was DISPATCHED the night is not over — this job cannot
      # know whether it will ship — so the close belongs to release.yml's
      # finalize (its own alarm rings if a leg goes red instead). Fully
      # tolerant: an API hiccup here must never taint the run.
      - name: Close the nightly-red alarm (a quiet, healthy night)
        if: ${{ steps.cut.outputs.dispatched != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          num="$(gh issue list --repo "$REPO" --label nightly-red --state open --json number --jq '.[0].number // empty' || true)"
          if [ -n "$num" ]; then
            gh issue close "$num" --repo "$REPO" \
              --comment "Verify is green again at $(git rev-parse --short HEAD) — the cadence stands." || true
          fi

  # THE RED-NIGHT ALARM: three straight red verifies (2026-08-03..05, the
  # mercs + holdfast slow-lane rots) died silently on the Actions page — a
  # broken cadence must be LOUD. Any failure among verify/cut files (or
  # feeds) the single open `nightly-red` issue with the run link and the
  # failing lines; the next night that truly SHIPS closes it (release.yml's
  # finalize — or the quiet-night step above). release.yml carries the
  # alarm's other half for its own legs, feeding the same issue. ONE issue,
  # reds accumulating as comments, so an outage reads as one timeline and
  # reaches the repo owner's notifications the night it starts.
  alarm:
    needs: [verify, cut]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: File or feed the nightly-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The failing lines come from the FAILED JOB's own log: the REST
          # job-logs endpoint serves a completed job while its run is still
          # going, whereas `gh run view --log-failed` refuses an in-progress
          # run outright — and this job IS that run, so the tail read empty
          # on every red night the alarm ever rang. Timestamps stripped.
          tail="$(
            for job in $(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
                --jq '.jobs[] | select(.conclusion == "failure") | .id'); do
              gh api "repos/$REPO/actions/jobs/$job/logs" 2>/dev/null || true
            done \
              | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z //' \
              | grep -E 'REGRESSED|FAIL |error TS|##\[error\]' | tail -n 12
          )" || true
          body="$(printf 'A nightly run went red — no RC was cut tonight.\n\nRun: %s (HEAD %s)\n\n```\n%s\n```\n\nFix the tree, then either let the next night cut, or re-cut now with the workflow_dispatch button.' \
            "$RUN_URL" "${GITHUB_SHA:0:9}" "${tail:-log tail unavailable — open the run link}")"
          gh label create nightly-red --repo "$REPO" --color B60205 \
            --description "The nightly RC lane is red — cadence interrupted" --force
          num="$(gh issue list --repo "$REPO" --label nightly-red --state open --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --label nightly-red --body "$body" \
              --title "Nightly RC red — the release cadence is interrupted"
          fi
