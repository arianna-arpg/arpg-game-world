# ---------------------------------------------------------------------------
# RELEASE BUILDS — push a version tag (v0.2.0) and this attaches a Windows
# installer + a Linux AppImage (the Steam Deck artifact) to that GitHub
# Release. electron-builder's github publisher does the uploading; the tag
# should match package.json's version (bump it in the same commit you tag).
#
# Manual runs (workflow_dispatch) on a BRANCH build the same artifacts and
# stash them as workflow artifacts instead of publishing — a dry run for the
# pipeline. Dispatched on a TAG ref (how nightly.yml drives this after
# pushing its RC tag — GITHUB_TOKEN tag pushes can't trigger on:push), it
# publishes exactly like a tag push; rc=true makes finalize publish as a
# PRERELEASE (invisible to /releases/latest, the launcher's update probe)
# instead of the new latest.
# ---------------------------------------------------------------------------
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      rc:
        description: 'Publish as a prerelease RC (the nightly channel)'
        type: boolean
        default: false

permissions:
  contents: write   # electron-builder uploads release assets

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Tag builds stamp the TAG's version into the workspace before anything
      # reads it. Hand-cut stables bump package.json in the tagged commit, so
      # for them this is a value-level no-op; nightly RC tags carry no bump
      # commit, and this stamp is what keys electron-builder's draft, the
      # artifact names, and the packaged launcher's identity to the tag
      # (version mismatch = orphan draft). assume-unchanged keeps
      # build-info's dirty probe honest — the tree is still byte-for-byte the
      # tagged commit's content, the version is the tag's own datum.
      - name: Stamp tag version into the workspace
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          npm pkg set version="${GITHUB_REF_NAME#v}"
          git update-index --assume-unchanged package.json
          echo "workspace version = $(npm pkg get version)"

      # Same pipeline as `npm run dist`, split so CI logs separate the stages.
      - run: npm run build
      - run: node scripts/make-build-info.mjs

      # Uploads land on a DRAFT release (electron-builder.yml releaseType),
      # where same-name assets are replaced — so one retry after a transient
      # CDN/API hiccup (the 504 that sank v0.2.0's first run) is safe.
      - name: Package (and publish on tag builds)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        run: |
          npx electron-builder ${{ matrix.args }} --publish "$PUBLISH" || {
            echo "electron-builder failed — retrying once in 20s (transient network errors)…"
            sleep 20
            npx electron-builder ${{ matrix.args }} --publish "$PUBLISH"
          }

      - name: Stash artifacts (manual dry runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  # Both legs upload into a DRAFT (electron-builder.yml releaseType) — this
  # job is what actually ships it: stamp a human title + notes (curated
  # docs/releases/<tag>.md when the repo carries them, else GitHub's
  # auto-generated commit list), then flip the draft public and mark it
  # latest. It runs only when every leg succeeded, so /releases/latest —
  # the launcher's update probe — never serves a partial release.
  finalize:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the draft with title + notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          RC: ${{ inputs.rc && 'true' || 'false' }}
        run: |
          # GET /releases/tags/:tag hides drafts — find ours in the list.
          id="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
                --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)"
          if [ -z "$id" ]; then echo "no release found for tag $TAG"; exit 1; fi
          if [ -f "docs/releases/${TAG}.md" ]; then
            notes="$(cat "docs/releases/${TAG}.md")"
          else
            notes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$TAG" --jq .body)"
          fi
          if [ "$RC" = "true" ]; then
            # Nightly RC: a PRERELEASE, never latest — /releases/latest (the
            # launcher's update probe and the Deck install link) keeps
            # serving the newest STABLE; testers pick RCs off the page.
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$id" \
              -f name="Hollow Wake $TAG (nightly RC)" -f body="$notes" \
              -F draft=false -F prerelease=true -f make_latest=false
          else
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$id" \
              -f name="Hollow Wake $TAG" -f body="$notes" \
              -F draft=false -f make_latest=true
          fi
