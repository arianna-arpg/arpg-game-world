# Required before main changes. Keep the job name "check" stable: GitHub's
# branch protection requires it, including for same-repository pull requests.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. A new push supersedes the one still running on that branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Types first: a broken tree makes every probe verdict meaningless.
      - name: Type-check (game + launcher + balance harness)
        run: npm run check

      - name: Repository and launcher regression tests
        run: node --test scripts/test-*.mjs
      - name: All green probes, including the nightly lane
        run: npm run probe -- --slow
      - name: Combat simulation
        run: npm run sim -- run --suite smoke
      - name: Generation checks
        run: npm run genqa
      - name: Build the game
        run: npm run build
      - name: Prepare the Linux desktop sandbox
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Boot game, launcher and update path
        run: |
          xvfb-run --auto-servernum npm run smoke
          xvfb-run --auto-servernum npm run smoke:launcher
          xvfb-run --auto-servernum npm run smoke:update
