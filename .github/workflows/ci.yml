name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playable:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:launcher
      - name: Current gameplay, saves, terrain and hosted entry
        run: npm run probe -- --jobs 2
      - run: npm run sim -- run --suite smoke
      - run: npm run genqa
      - run: npm run build
      - name: Actual Begin, continuous walk and Continue
        run: xvfb-run --auto-servernum npm run smoke:world
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seamless-playthrough
          path: |
            balance/reports/seamless-playthrough/REPORT.json
            balance/reports/seamless-playthrough/*.png
