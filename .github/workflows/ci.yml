# Keep main's required job identity and every seamless acceptance step.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check game, launcher, simulation and host
        run: npm run check
      - name: Repository and launcher regression tests
        run: node --test scripts/test-*.mjs
      - name: Shared gameplay regressions
        run: npm run test:shared-fixes
      - name: Shared reliability regressions
        run: npm run test:reliability
      - name: Current gameplay, saves, terrain and hosted entry
        # On seamless, --slow opts into the historical source archive.
        # Preserve this branch's current behavior gate and full client course.
        run: npm run probe -- --jobs 2
      - name: Combat simulation
        run: npm run sim -- run --suite smoke
      - name: Generation checks
        run: npm run genqa
      - name: Build the game
        run: npm run build
      - name: Prepare the Linux desktop sandbox
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Boot game, launcher and update path
        run: |
          xvfb-run --auto-servernum npm run test:reliability:ui
          xvfb-run --auto-servernum npm run test:layers
          xvfb-run --auto-servernum npm run smoke
          xvfb-run --auto-servernum npm run smoke:launcher
          xvfb-run --auto-servernum npm run smoke:update
      - name: Actual Begin, continuous walk and Continue
        run: xvfb-run --auto-servernum npm run smoke:world
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seamless-playthrough
          path: |
            balance/reports/seamless-playthrough/REPORT.json
            balance/reports/seamless-playthrough/*.png
