<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Launcher</title>
  <style>
    /* Same palette as the game (index.html) so the launcher feels like the
       game's front door, not a build tool. */
    :root {
      --panel-bg: rgba(12, 12, 18, 0.92);
      --panel-border: #3a3a52;
      --gold: #c8a84b;
      --text: #d8d4c8;
      --text-dim: #8a8678;
      --good: #6fc06f;
      --bad: #d05050;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #0a0a0e; overflow: hidden;
      font-family: 'Segoe UI', Verdana, sans-serif;
      color: var(--text); user-select: none;
      display: flex; flex-direction: column;
    }
    #wrap { display: flex; flex-direction: column; height: 100%; padding: 22px 26px 16px; gap: 12px; }
    h1 { color: var(--gold); font-size: 24px; letter-spacing: 3px; margin: 0; text-align: center; text-transform: uppercase; }
    /* THE LOCKUP: the insignia beside the wordmark — the website's nav brand
       verbatim (frame in ether, the three points in the trio), so the
       launcher reads as the same thing the taskbar icon and the site are. */
    #lockup { display: flex; align-items: center; justify-content: center; gap: 12px; }
    #hwmark { width: 34px; height: 34px; flex: 0 0 auto; }
    #build-line { text-align: center; font-size: 12px; color: var(--text-dim); min-height: 16px; }
    #build-line b { color: var(--text); font-weight: 600; }
    #build-line .dirty { color: var(--gold); }

    #update-area {
      border: 1px solid var(--panel-border); border-radius: 6px;
      background: var(--panel-bg); padding: 10px 12px; font-size: 12px;
      min-height: 58px; max-height: 170px; overflow-y: auto;
      flex: 0 0 auto; /* the LOG is the flexible row — this box scrolls only past its max */
    }
    #update-status { font-size: 13px; }
    #update-status.good { color: var(--good); }
    #update-status.avail { color: var(--gold); font-weight: bold; }
    #update-status.bad { color: var(--bad); }
    #changes { margin: 6px 0 0 0; padding: 0; list-style: none; }
    #changes li { padding: 1px 0; color: var(--text); }
    #changes li code { color: var(--text-dim); font-size: 11px; margin-right: 7px; }
    /* THE RELEASE CHANNEL: one quiet row under the update box, shown only
       where updates come from GitHub Releases (a packaged install). */
    #channel-row { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--text-dim); padding: 0 2px; flex: 0 0 auto; }
    #channel-row label { color: var(--text); flex: 0 0 auto; }
    #channel-row select {
      flex: 0 0 auto; font: inherit; color: var(--gold); background: #1b1b2a;
      border: 1px solid var(--panel-border); border-radius: 4px; padding: 3px 6px; cursor: pointer;
    }
    #channel-row select:disabled { opacity: 0.4; cursor: default; }
    #channel-blurb { flex: 1 1 auto; font-size: 11px; line-height: 1.35; }

    #btns { display: flex; flex-direction: column; gap: 8px; align-items: center; }
    #btns button {
      width: 300px; padding: 10px 0; font-size: 14px; font-family: inherit; cursor: pointer;
      background: linear-gradient(180deg, #30304a, #232338);
      color: var(--gold); border: 1px solid var(--gold); border-radius: 5px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.45);
      transition: background 0.15s, box-shadow 0.15s, transform 0.05s;
    }
    #btns button:hover:not(:disabled) {
      background: linear-gradient(180deg, #3d3d5c, #2b2b46);
      box-shadow: 0 0 9px rgba(200,168,75,0.4);
    }
    #btns button:active:not(:disabled) { transform: translateY(1px); }
    #btns button:disabled { opacity: 0.4; cursor: default; border-color: var(--panel-border); color: var(--text-dim); box-shadow: none; }
    #btns #play { font-size: 17px; letter-spacing: 2px; padding: 13px 0; }
    #btns #update-btn { border-color: var(--good); color: #b6f0b6; background: linear-gradient(180deg, #2c3a2c, #223022); }
    #btns .minor { width: 300px; display: flex; gap: 8px; }
    #btns .minor button { flex: 1; width: auto; font-size: 12px; padding: 7px 0; }
    #btns button.danger { border-color: #8a4040; color: #d08080; background: linear-gradient(180deg, #34242c, #251b21); }
    #btns button.danger:hover:not(:disabled) { background: linear-gradient(180deg, #46282f, #2f1e24); box-shadow: 0 0 9px rgba(208,80,80,0.4); }
    /* THE DEVELOPER BOX: player mode shows one quiet row and keeps the log
       and Rebuild out of sight (a launched game, not a build tool); the
       master toggle unfolds the sub-toggles beneath it and brings them back.
       A failure line still reveals the log in player mode — an error always
       has somewhere visible to land. */
    #devbox { border: 1px solid var(--panel-border); border-radius: 6px; background: var(--panel-bg); padding: 7px 12px; font-size: 12px; }
    #devbox label { display: flex; align-items: center; gap: 9px; cursor: pointer; padding: 3px 0; }
    #devbox label small { color: var(--text-dim); font-size: 11px; }
    #devbox input[type=checkbox] { accent-color: var(--gold); margin: 0; flex: 0 0 auto; }
    #dev-master { color: var(--gold); font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }
    #dev-master small { text-transform: none; letter-spacing: 0; font-weight: 400; }
    #dev-subs { margin: 3px 0 0 6px; padding-left: 12px; border-left: 1px solid var(--panel-border); }
    #devbox.player #dev-subs { display: none; }
    body.player #log:not(.reveal), body.player #rebuild { display: none; }
    .hidden { display: none !important; }

    #log {
      flex: 1 1 auto; min-height: 90px;
      border: 1px solid var(--panel-border); border-radius: 6px;
      background: #08080c; padding: 8px 10px; overflow-y: auto;
      font: 11px Consolas, monospace; color: var(--text-dim);
      white-space: pre-wrap; word-break: break-word; user-select: text;
    }
    #hint { text-align: center; font-size: 10px; color: var(--text-dim); }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="lockup">
      <svg id="hwmark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="12" stroke="url(#hwLauncherGrad)" stroke-width="1.4" opacity=".9"/><path d="M16 11.6V6.2M19.8 18.2l4.7 2.7M12.2 18.2l-4.7 2.7" stroke="url(#hwLauncherGrad)" stroke-width="1.1" opacity=".55"/><circle cx="16" cy="16" r="4.4" stroke="url(#hwLauncherGrad)" stroke-width="1.5"/><circle cx="16" cy="4" r="2.2" fill="#4fd6c4"/><circle cx="26.4" cy="22" r="2.2" fill="#a98bff"/><circle cx="5.6" cy="22" r="2.2" fill="#ff8a4c"/><defs><linearGradient id="hwLauncherGrad" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#b0c6e4"/><stop offset="1" stop-color="#8fa8d8"/></linearGradient></defs></svg>
      <h1 id="title">ARPG</h1>
    </div>
    <div id="build-line">Reading build info…</div>
    <div id="update-area">
      <div id="update-status">Update check pending…</div>
      <ul id="changes"></ul>
    </div>
    <div id="channel-row" class="hidden">
      <label for="channel">Update channel</label>
      <select id="channel"></select>
      <span id="channel-blurb"></span>
    </div>
    <div id="btns">
      <button id="play">▶&nbsp; PLAY</button>
      <button id="update-btn" class="hidden">⬇&nbsp; Update &amp; Play</button>
      <div class="minor">
        <button id="check">Check for updates</button>
        <button id="rebuild">Rebuild</button>
        <button id="quit">Quit</button>
      </div>
      <div class="minor">
        <button id="reset" class="danger"
          title="Factory reset: erase the account, every character and roster slot, settings, and all cached game data. A confirm dialog follows.">
          Erase all saved data…</button>
      </div>
    </div>
    <div id="devbox" class="player">
      <label id="dev-master" title="Off: a launched game — no DevTools, no dev panel, the build log tucked away. On: DevTools (F12 / F5), the in-game dev panel, the log, and the toggles below.">
        <input type="checkbox" id="dev-developer"> Developer mode <small>DevTools, the in-game dev panel, the build log</small>
      </label>
      <div id="dev-subs">
        <label id="row-liveSource" title="Run the game from src/ on a Vite dev server the launcher starts: edits hot-reload, no rebuild, and the passive tree editor saves straight to source. Off: the built dist/ with the tools above.">
          <input type="checkbox" id="dev-liveSource"> Live source <small>run from src/ with hot reload; no rebuild between edits</small>
        </label>
        <label title="Puts the Entity Forge, the Glyph Forge and the Map Forge on the start menu (and their dev-panel tabs come alive).">
          <input type="checkbox" id="dev-forges"> Forges <small>Entity, Glyph and Map forge on the start menu</small>
        </label>
        <label title="Turns the passive tree (P) into an editor: move nodes, link them, edit their stats, Save. Under Live source, Save writes src/data/passives.ts; on the built game it rescues the tree to saves/save_passives_editor.json instead.">
          <input type="checkbox" id="dev-passiveEditor"> Passive tree editor <small>edit the tree in-game; Save writes src/data/passives.ts under live source</small>
        </label>
        <label id="row-console" title="Launch Game.bat normally hands off to the desktop shell and closes its terminal. On, it keeps that window open so main-process output has somewhere to land. Read at launch, so it applies next time.">
          <input type="checkbox" id="dev-console"> Terminal window <small>keep the console Launch Game.bat opens (next launch)</small>
        </label>
      </div>
    </div>
    <div id="log"></div>
    <div id="hint">Updates pull from GitHub, then the game rebuilds itself. Play works offline.</div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const logEl = $('log');
    const buttons = ['play', 'update-btn', 'check', 'rebuild', 'reset', 'quit', 'channel'].map($);

    function appendLog(line) {
      logEl.textContent += line + '\n';
      logEl.scrollTop = logEl.scrollHeight;
      if (/FAILED/.test(line)) logEl.classList.add('reveal'); // player mode still shows an error
    }
    function setBusy(b) { buttons.forEach(el => { el.disabled = b; }); }

    // THE DEVELOPER BOX — the stored toggles (s.dev) drive the checkboxes,
    // the master folds the page between its two faces, and rows that cannot
    // apply here (no source in a packaged install; the terminal is Launch
    // Game.bat's, a Windows checkout thing) stay hidden.
    const DEV_KEYS = ['developer', 'liveSource', 'forges', 'passiveEditor', 'console'];
    let lastStatus = null;
    function renderDev(s) {
      const d = s.dev || {};
      for (const k of DEV_KEYS) $('dev-' + k).checked = !!d[k];
      const dev = !!d.developer;
      $('devbox').classList.toggle('player', !dev);
      document.body.classList.toggle('player', !dev);
      $('row-liveSource').classList.toggle('hidden', !!s.packaged);
      $('row-console').classList.toggle('hidden', !!s.packaged || s.platform !== 'win32');
    }
    for (const k of DEV_KEYS) {
      $('dev-' + k).addEventListener('change', async (e) => {
        const r = await window.launcher.setDev({ [k]: !!e.target.checked });
        if (r && r.ok) { lastStatus = { ...(lastStatus || {}), dev: r.dev, mode: r.mode }; renderDev(lastStatus); }
        else { appendLog('SETTINGS FAILED: ' + ((r && r.error) || 'unknown error')); await refresh(); }
      });
    }

    // THE RELEASE CHANNEL — the rows come from the main process (the channel
    // registry in launcher/updates.cjs); the page only draws them. Shown
    // where updates come from GitHub Releases; a checkout pulls the branch.
    function renderChannel(s) {
      const sel = $('channel'), rows = Array.isArray(s.channels) ? s.channels : [];
      $('channel-row').classList.toggle('hidden', s.updateMode !== 'release' || rows.length < 2);
      if (sel.options.length !== rows.length) {
        sel.innerHTML = '';
        for (const c of rows) {
          const o = document.createElement('option');
          o.value = c.id; o.textContent = c.label;
          sel.appendChild(o);
        }
      }
      sel.value = s.channel || (rows[0] && rows[0].id) || '';
      const row = rows.find(c => c.id === sel.value);
      $('channel-blurb').textContent = row ? row.blurb : '';
    }
    $('channel').addEventListener('change', async (e) => {
      setBusy(true);
      try {
        const r = await window.launcher.setChannel(e.target.value);
        if (!(r && r.ok)) appendLog('SETTINGS FAILED: ' + ((r && r.error) || 'unknown error'));
        if (r && r.channels) { lastStatus = { ...(lastStatus || {}), channel: r.channel, channels: r.channels }; renderChannel(lastStatus); }
      } finally { setBusy(false); }
      await doCheck(); // the old channel's answer no longer stands
    });

    function renderStatus(s) {
      lastStatus = s;
      renderDev(s);
      renderChannel(s);
      $('title').textContent = s.title;
      document.title = s.title + ' — Launcher';
      $('build-line').innerHTML =
        `v${s.version} · <b>${s.branch || 'release'}</b> @ <b>${s.hash || '?'}</b>` +
        (s.subject ? ` — “${s.subject}”` : '') +
        (s.dirty ? ' <span class="dirty">(modified locally)</span>' : '');
      // PACKAGED install (no repo, no toolchain): the rebuild button is
      // meaningless, and Update means "download from GitHub Releases and
      // install it in place" (directInstall=false keeps the old open-the-
      // release-page behavior).
      if (s.packaged) {
        $('rebuild').classList.add('hidden');
        $('update-btn').textContent = s.directInstall ? '⬇  Update & Restart' : '⬇  Get Update (opens browser)';
        $('hint').textContent = s.directInstall
          ? 'Playing is fully offline. Updates download from GitHub Releases and install themselves.'
          : 'Playing is fully offline. Updates come from GitHub Releases.';
      }
      if (s.updateMode === 'none') $('check').classList.add('hidden');
    }

    function renderCheck(r) {
      const st = $('update-status'), list = $('changes');
      list.innerHTML = '';
      $('update-btn').classList.add('hidden');
      if (!r.ok) {
        st.className = 'bad';
        st.textContent = r.hint || 'Could not reach GitHub — playing the installed version is fine.';
        return;
      }
      if (r.mode === 'none') {
        st.className = '';
        st.textContent = 'Update checks are disabled (updates.mode in launcher.config.json).';
        return;
      }
      if (r.behind === 0) {
        st.className = 'good';
        st.textContent = 'Up to date.' + (r.ahead > 0 ? ` (${r.ahead} local commit${r.ahead === 1 ? '' : 's'} not pushed yet)` : '');
        return;
      }
      st.className = 'avail';
      // A release install jumps straight to the NEWEST build (the first row);
      // the rest of the list is simply what it has been missing.
      st.textContent = (r.mode === 'release' && r.changes.length)
        ? `${r.changes[0].hash} is available` + (r.behind > 1 ? ` — ${r.behind}${r.capped ? '+' : ''} builds newer than yours:` : ':')
        : `${r.behind} update${r.behind === 1 ? '' : 's'} available:`;
      for (const c of r.changes.slice(0, 12)) {
        const li = document.createElement('li');
        const code = document.createElement('code'); code.textContent = c.hash;
        li.appendChild(code); li.appendChild(document.createTextNode(c.subject));
        list.appendChild(li);
      }
      if (r.changes.length > 12) {
        const li = document.createElement('li');
        li.textContent = `… and ${r.changes.length - 12} more`;
        list.appendChild(li);
      }
      $('update-btn').classList.remove('hidden');
    }

    async function refresh() { renderStatus(await window.launcher.status()); }
    async function doCheck() {
      setBusy(true);
      try { renderCheck(await window.launcher.check()); } finally { setBusy(false); }
    }
    async function doPlay() {
      setBusy(true);
      try {
        const r = await window.launcher.play();
        if (!r.ok) { appendLog('PLAY FAILED: ' + (r.error || 'unknown error')); }
      } finally { setBusy(false); }
    }

    $('play').addEventListener('click', doPlay);
    $('check').addEventListener('click', doCheck);
    $('update-btn').addEventListener('click', async () => {
      setBusy(true);
      try {
        const r = await window.launcher.update();
        if (!r.ok) { appendLog('UPDATE FAILED: ' + (r.error || 'unknown error')); return; }
        // Direct release update: the new version is installing and will
        // relaunch itself — this process is about to exit.
        if (r.installing) {
          const st = $('update-status');
          st.className = 'avail';
          st.textContent = 'Update installed — restarting…';
          appendLog('The launcher closes while the update applies; the game reopens updated.');
          return;
        }
        // Release-page fallback — this install stays as-is until the player
        // runs the new one; don't auto-play the old build.
        if (r.opened) { appendLog('Download page opened — install the new version, then relaunch.'); return; }
        await refresh();
        renderCheck({ ok: true, behind: 0, ahead: 0, changes: [] });
        const p = await window.launcher.play();
        if (!p.ok) appendLog('PLAY FAILED: ' + (p.error || 'unknown error'));
      } finally { setBusy(false); }
    });
    $('rebuild').addEventListener('click', async () => {
      setBusy(true);
      try {
        const r = await window.launcher.rebuild();
        appendLog(r.ok ? 'Rebuild complete.' : 'REBUILD FAILED: ' + (r.error || 'unknown error'));
      } finally { setBusy(false); }
    });
    $('reset').addEventListener('click', async () => {
      setBusy(true);
      try {
        // Outcome lines stream from the main process into the log; only the
        // error path needs surfacing here (e.g. "close the game first").
        const r = await window.launcher.reset();
        if (!r.ok) appendLog('RESET FAILED: ' + (r.error || 'unknown error'));
      } finally { setBusy(false); }
    });
    $('quit').addEventListener('click', () => window.launcher.quit());
    window.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !$('play').disabled) doPlay(); });

    window.launcher.onLog(appendLog);
    window.launcher.onProgress((p) => {
      const st = $('update-status');
      st.className = 'avail';
      st.textContent = `Downloading ${p.tag || 'update'} — ${p.pct}%` +
        (p.totalMb ? ` (${Math.round(p.gotMb)} / ${Math.round(p.totalMb)} MB)` : '');
    });
    window.launcher.onState(async (s) => { if (s && s.t === 'game-closed') { await refresh(); } });

    (async () => {
      const s = await window.launcher.status();
      renderStatus(s);
      if (s.checkOnLaunch) await doCheck();
      else $('update-status').textContent = 'Automatic update checks are off (launcher.config.json).';
    })();
  </script>
</body>
</html>
